<!DOCTYPE html>
<html lang="zh-Hant" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0b0e14">
    <title>平台與手續費設定 · FinPulse Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'Noto Sans TC', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] },
                    colors: {
                        terminal: {
                            bg: '#0b0e14', card: '#131722', border: '#2a2e39', hover: '#1e222d',
                            accent: '#2962ff', up: '#089981', down: '#f23645', warn: '#f59e0b',
                            text: '#d1d4dc', muted: '#787b86'
                        }
                    }
                }
            }
        };
    </script>
    <style>
        body { background-color: #0b0e14; color: #d1d4dc; font-feature-settings: "tnum"; }
        .tabular-nums { font-variant-numeric: tabular-nums; }
        .glass-header { background: rgba(19, 23, 34, 0.9); backdrop-filter: blur(12px); border-bottom: 1px solid #2a2e39; }
    </style>
</head>
<body class="min-h-screen flex flex-col pb-24 md:pb-8">
    <div id="shared-header"></div>

    <main class="flex-1 max-w-7xl w-full mx-auto px-3 sm:px-4 pt-5 space-y-6">
        <div id="shared-kpis"></div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            <!-- 新增戶口與平台手續費規則表單 -->
            <div class="lg:col-span-5 bg-terminal-card border border-terminal-border rounded-2xl p-4 sm:p-5">
                <h2 class="text-base sm:text-lg font-bold text-white mb-1">🏦 新增銀行 / 投資 App 與預設手續費</h2>
                <p class="text-xs text-terminal-muted mb-4">不同股票 App 的手續費不同，可在此設定該平台的預設固定費或費率%，試算與買入時會自動套用。</p>

                <form id="account-form" onsubmit="handleAddAccount(event)" class="space-y-3.5">
                    <div class="grid grid-cols-2 gap-2 p-1 bg-terminal-bg rounded-xl border border-terminal-border">
                        <label class="cursor-pointer">
                            <input type="radio" name="acc-category" value="bank" checked class="peer hidden">
                            <div class="py-2 text-center text-xs sm:text-sm font-semibold rounded-lg text-terminal-muted peer-checked:bg-blue-600 peer-checked:text-white transition">
                                🏦 銀行 (Bank)
                            </div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="acc-category" value="broker" class="peer hidden">
                            <div class="py-2 text-center text-xs sm:text-sm font-semibold rounded-lg text-terminal-muted peer-checked:bg-purple-600 peer-checked:text-white transition">
                                📱 投資平台 App (如富達/IB)
                            </div>
                        </label>
                    </div>

                    <div>
                        <label class="block text-xs text-terminal-muted mb-1">機構 / App 名稱 <span class="text-blue-400">*</span></label>
                        <input type="text" id="acc-institution" required placeholder="例如：匯豐銀行 HSBC、富達 Fidelity、IB 盈透" class="w-full bg-terminal-bg border border-terminal-border rounded-xl px-3 py-2 text-sm text-white focus:border-blue-500 focus:outline-none">
                    </div>

                    <div>
                        <label class="block text-xs text-terminal-muted mb-1">細項戶口名稱 <span class="text-blue-400">*</span></label>
                        <input type="text" id="acc-subname" required placeholder="例如：港元儲蓄戶口、澳元戶口、美債投資戶口" class="w-full bg-terminal-bg border border-terminal-border rounded-xl px-3 py-2 text-sm text-white focus:border-blue-500 focus:outline-none">
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs text-terminal-muted mb-1">戶口主幣別</label>
                            <div class="flex gap-1.5">
                                <select id="acc-currency" class="flex-1 bg-terminal-bg border border-terminal-border rounded-xl px-3 py-2 text-sm font-mono text-white focus:outline-none focus:border-blue-500"></select>
                                <button type="button" onclick="toggleFxModal(true)" title="新增自訂幣別" class="px-2.5 py-2 rounded-xl bg-terminal-hover hover:bg-blue-600 border border-terminal-border text-xs font-bold text-blue-300 hover:text-white transition">+</button>
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs text-terminal-muted mb-1">初始餘額</label>
                            <input type="number" step="0.01" id="acc-balance" value="0" required class="w-full bg-terminal-bg border border-terminal-border rounded-xl px-3 py-2 text-sm font-mono text-white focus:border-blue-500 focus:outline-none">
                        </div>
                    </div>

                    <div class="bg-terminal-bg border border-purple-500/30 rounded-xl p-3 space-y-2">
                        <div class="text-xs font-semibold text-purple-300">⚙️ 該平台預設交易/認購手續費規則 (選填)</div>
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="block text-[11px] text-terminal-muted mb-1">固定/最低收費 (原幣)</label>
                                <input type="number" step="0.01" min="0" id="acc-fee-flat" value="0" placeholder="例如 15" class="w-full bg-terminal-card border border-terminal-border rounded-lg px-2.5 py-1.5 text-xs font-mono text-amber-400 focus:outline-none">
                            </div>
                            <div>
                                <label class="block text-[11px] text-terminal-muted mb-1">或按金額費率 (%)</label>
                                <input type="number" step="0.001" min="0" id="acc-fee-pct" value="0" placeholder="例如 0.05" class="w-full bg-terminal-card border border-terminal-border rounded-lg px-2.5 py-1.5 text-xs font-mono text-amber-400 focus:outline-none">
                            </div>
                        </div>
                        <p class="text-[10px] text-terminal-muted">計算邏輯：取「固定/最低收費」與「本金 × 費率%」兩者較高值作為預設參考。</p>
                    </div>

                    <button type="submit" class="w-full py-3 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-semibold text-sm shadow-lg transition">
                        + 新增戶口與手續費設定
                    </button>
                </form>
            </div>

            <!-- 已建立的戶口清單 + 備份管理 -->
            <div class="lg:col-span-7 space-y-4">
                <div class="bg-terminal-card border border-terminal-border rounded-2xl p-4 sm:p-5 space-y-4">
                    <div class="flex flex-wrap items-center justify-between gap-2">
                        <h3 class="text-base font-bold text-white">📑 已建立的銀行與投資平台清單</h3>
                        <div class="flex flex-wrap items-center gap-2">
                            <button onclick="exportBackupJSON()" class="text-xs px-3 py-1.5 rounded-lg bg-blue-600/20 hover:bg-blue-600 text-blue-300 hover:text-white border border-blue-500/30 transition">
                                ⬇ 匯出 JSON 備份
                            </button>
                            <label class="cursor-pointer text-xs px-3 py-1.5 rounded-lg bg-emerald-600/20 hover:bg-emerald-600 text-emerald-300 hover:text-white border border-emerald-500/30 transition">
                                ⬆ 還原備份
                                <input type="file" accept=".json" onchange="importBackupJSON(event)" class="hidden">
                            </label>
                            <button onclick="resetToDemoData()" class="text-xs px-3 py-1.5 rounded-lg bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/30 transition">
                                重置範例
                            </button>
                        </div>
                    </div>
                    <div id="accounts-list" class="grid grid-cols-1 sm:grid-cols-2 gap-3"></div>
                </div>
            </div>
        </div>
    </main>

    <div id="shared-mobile-nav"></div>

    <script src="app.js"></script>
    <script>
        window.CURRENT_PAGE_ID = 'accounts';

        // Fallback initializer when previewing accounts.html standalone without external app.js
        if (typeof window.renderSharedChrome !== 'function') {
            window.currencyRegistry = JSON.parse(localStorage.getItem('currency_registry_v1') || '{"HKD":{"code":"HKD","symbol":"HK$","label":"港幣"},"USD":{"code":"USD","symbol":"US$","label":"美元"},"AUD":{"code":"AUD","symbol":"A$","label":"澳元"},"JPY":{"code":"JPY","symbol":"¥","label":"日圓"}}');
            window.db = JSON.parse(localStorage.getItem('finpulse_pro_multicurrency_v2') || '{"accounts":[],"cashflows":[],"holdings":[],"simDrafts":[]}');
            window.getCurrencyDisplayOption = (c) => window.currencyRegistry[c] ? `${c} (${window.currencyRegistry[c].label})` : c;
            window.getAccountDynamicBalance = (acc) => acc.initialBalance || 0;
            window.saveDatabase = () => {
                localStorage.setItem('finpulse_pro_multicurrency_v2', JSON.stringify(window.db));
                if (typeof window.onPageDataUpdated === 'function') window.onPageDataUpdated();
            };
            window.showToast = (msg) => console.log('[FinPulse]', msg);
            window.renderSharedChrome = () => {};
        }

        function populateAccountCurrencyOptions() {
            const codes = Object.keys(window.currencyRegistry);
            const accCurr = document.getElementById('acc-currency');
            const prev = accCurr.value || 'HKD';
            accCurr.innerHTML = codes.map(c => `<option value="${c}">${getCurrencyDisplayOption(c)}</option>`).join('');
            accCurr.value = codes.includes(prev) ? prev : 'HKD';
        }

        function handleAddAccount(e) {
            e.preventDefault();
            const category = document.querySelector('input[name="acc-category"]:checked').value;
            const institutionName = document.getElementById('acc-institution').value.trim();
            const subAccountName = document.getElementById('acc-subname').value.trim();
            const currency = document.getElementById('acc-currency').value;
            const initialBalance = parseFloat(document.getElementById('acc-balance').value) || 0;
            const flat = parseFloat(document.getElementById('acc-fee-flat').value) || 0;
            const pct = parseFloat(document.getElementById('acc-fee-pct').value) || 0;

            if (!institutionName || !subAccountName) return;

            window.db.accounts.push({
                id: 'acc_' + Date.now(), category, institutionName, subAccountName,
                currency, initialBalance, feeRule: { flat, pct }
            });

            document.getElementById('account-form').reset();
            saveDatabase();
            showToast(`已新增戶口：${institutionName} - ${subAccountName}`);
        }

        function deleteAccount(id) {
            const used = window.db.cashflows.some(c => c.accountId === id || c.fromAccountId === id || c.toAccountId === id)
                      || window.db.holdings.some(h => h.accountId === id);
            if (used) {
                showToast('無法刪除：此戶口下仍有交易或持倉紀錄。', 'error');
                return;
            }
            window.db.accounts = window.db.accounts.filter(a => a.id !== id);
            saveDatabase();
            showToast('已刪除該戶口設定');
        }

        function renderAccountsList() {
            const listEl = document.getElementById('accounts-list');
            listEl.innerHTML = window.db.accounts.map(acc => {
                const currentBal = getAccountDynamicBalance(acc);
                const badge = acc.category === 'broker'
                    ? '<span class="text-[10px] px-2 py-0.5 rounded bg-purple-500/15 text-purple-400 border border-purple-500/30">📱 投資平台 App</span>'
                    : '<span class="text-[10px] px-2 py-0.5 rounded bg-blue-500/15 text-blue-400 border border-blue-500/30">🏦 銀行戶口</span>';

                const feeRuleText = (acc.feeRule && (acc.feeRule.flat > 0 || acc.feeRule.pct > 0))
                    ? `預設手續費: 最低 ${acc.currency} ${acc.feeRule.flat} 或 ${acc.feeRule.pct}%`
                    : '無預設交易手續費';

                return `
                    <div class="bg-terminal-bg border border-terminal-border rounded-xl p-3.5 flex flex-col justify-between">
                        <div>
                            <div class="flex items-center justify-between gap-2 mb-1.5">
                                ${badge}
                                <button onclick="deleteAccount('${acc.id}')" class="text-xs text-terminal-muted hover:text-rose-400">刪除</button>
                            </div>
                            <div class="font-bold text-white text-sm">${acc.institutionName}</div>
                            <div class="text-xs text-terminal-muted">${acc.subAccountName}</div>
                            <div class="text-[10px] font-mono text-purple-300 mt-1.5">${feeRuleText}</div>
                        </div>
                        <div class="mt-3 pt-2 border-t border-terminal-border flex items-baseline justify-between">
                            <span class="text-[11px] text-terminal-muted">當前結餘 (${acc.currency})</span>
                            <span class="font-mono font-bold text-sm text-white tabular-nums">${acc.currency} ${currentBal.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function exportBackupJSON() {
            const payload = { db: window.db, fxStore: window.fxStore, currencyRegistry: window.currencyRegistry };
            const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `FinPulse_MultiCurrency_Backup_${getRelativeDate(0)}.json`;
            a.click();
            URL.revokeObjectURL(url);
            showToast('已匯出完整多幣別、匯率與戶口 JSON 備份！');
        }

        function importBackupJSON(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const parsed = JSON.parse(e.target.result);
                    const importedDb = parsed.db ? parsed.db : parsed;
                    if (importedDb.accounts && importedDb.cashflows && importedDb.holdings) {
                        window.db = importedDb;
                        if (parsed.fxStore) {
                            window.fxStore = parsed.fxStore;
                            localStorage.setItem(FX_STORAGE_KEY, JSON.stringify(window.fxStore));
                        }
                        if (parsed.currencyRegistry) {
                            window.currencyRegistry = { ...DEFAULT_CURRENCY_REGISTRY, ...parsed.currencyRegistry };
                            saveCurrencyRegistry();
                        }
                        saveDatabase();
                        renderSharedChrome(window.CURRENT_PAGE_ID);
                        showToast('成功匯入備份資料！');
                    } else {
                        showToast('檔案格式不正確', 'error');
                    }
                } catch (err) {
                    showToast('解析 JSON 失敗', 'error');
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        function resetToDemoData() {
            window.db = JSON.parse(JSON.stringify(DEFAULT_DATA));
            window.fxStore = JSON.parse(JSON.stringify(DEFAULT_FX_RATES));
            window.currencyRegistry = JSON.parse(JSON.stringify(DEFAULT_CURRENCY_REGISTRY));
            localStorage.setItem(FX_STORAGE_KEY, JSON.stringify(window.fxStore));
            saveCurrencyRegistry();
            saveDatabase();
            renderSharedChrome(window.CURRENT_PAGE_ID);
            showToast('已重置為含澳元 (AUD) 等多幣別預設範例資料');
        }

        window.onPageDataUpdated = function() {
            populateAccountCurrencyOptions();
            renderAccountsList();
        };

        window.onload = function() {
            renderSharedChrome(window.CURRENT_PAGE_ID);
            window.onPageDataUpdated();
        };
    </script>
</body>
</html>
