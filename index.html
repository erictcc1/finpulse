<!DOCTYPE html>
<html lang="zh-Hant" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="FinPulse Pro">
    <meta name="theme-color" content="#0b0e14">
    <title>資金定位與看盤總覽 · FinPulse Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'Noto Sans TC', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] },
                    colors: {
                        terminal: {
                            bg: '#0b0e14', card: '#131722', border: '#2a2e39', hover: '#1e222d',
                            accent: '#2962ff', up: '#089981', down: '#f23645', warn: '#f59e0b',
                            text: '#d1d4dc', muted: '#787b86'
                        }
                    }
                }
            }
        };
    </script>
    <style>
        body { background-color: #0b0e14; color: #d1d4dc; font-feature-settings: "tnum"; }
        .tabular-nums { font-variant-numeric: tabular-nums; }
        .glass-header { background: rgba(19, 23, 34, 0.9); backdrop-filter: blur(12px); border-bottom: 1px solid #2a2e39; }
    </style>
</head>
<body class="min-h-screen flex flex-col pb-24 md:pb-8">
    <!-- 共用頂部導航列 -->
    <div id="shared-header"></div>

    <main class="flex-1 max-w-7xl w-full mx-auto px-3 sm:px-4 pt-5 space-y-6">
        <!-- 共用 4 大 KPI 卡片 -->
        <div id="shared-kpis"></div>

        <!-- 區塊 1：三層資金定位樹 (銀行/平台 App -> 細項戶口 -> 各幣別餘額與持倉) -->
        <section class="bg-terminal-card border border-terminal-border rounded-2xl p-4 sm:p-5 space-y-4">
            <div class="flex flex-wrap items-center justify-between gap-3 pb-3 border-b border-terminal-border">
                <div>
                    <h2 class="text-base sm:text-lg font-bold text-white flex items-center gap-2">
                        <span>🧭 跨平台與多幣別資金定位樹</span>
                        <span class="text-xs px-2 py-0.5 rounded-full bg-blue-500/10 text-blue-400 border border-blue-500/20">一眼看清每筆錢在哪個 App</span>
                    </h2>
                    <p class="text-xs text-terminal-muted mt-0.5">按「銀行 / 股票 App → 細項戶口 → 幣別」分層展示現金結餘與在途持倉</p>
                </div>
                <div class="flex items-center gap-2">
                    <select id="tree-currency-filter" onchange="renderLocationTree()" class="bg-terminal-bg border border-terminal-border rounded-xl px-3 py-1.5 text-xs text-white focus:outline-none"></select>
                </div>
            </div>

            <div id="location-tree-grid" class="grid grid-cols-1 lg:grid-cols-2 gap-4"></div>
        </section>

        <!-- 區塊 2：股市級現金流走勢圖 -->
        <section class="bg-terminal-card border border-terminal-border rounded-2xl p-4 sm:p-5">
            <div class="flex flex-wrap items-center justify-between gap-3 mb-4 pb-3 border-b border-terminal-border">
                <div>
                    <div class="flex items-center gap-2">
                        <span class="w-2.5 h-2.5 rounded-full bg-terminal-up"></span>
                        <h2 class="text-base sm:text-lg font-bold text-white">CASHFLOW TERMINAL · 現金流與資金淨值看盤</h2>
                    </div>
                    <p class="text-xs text-terminal-muted mt-0.5">切換單一原幣（如只看 USD 或 HKD）可排除匯率波動干擾，純看真實收支動能</p>
                </div>

                <div class="flex flex-wrap items-center gap-2">
                    <select id="chart-currency-scope" onchange="renderCashflowChart()" class="bg-terminal-bg border border-terminal-border rounded-lg px-2.5 py-1 text-xs font-mono text-amber-400 focus:outline-none"></select>

                    <div class="bg-terminal-bg p-1 rounded-lg border border-terminal-border flex text-xs">
                        <button onclick="setChartMode('cumulative')" id="chart-mode-cumulative" class="chart-mode-btn px-2.5 py-0.5 rounded bg-terminal-hover text-white font-medium">累計淨值線</button>
                        <button onclick="setChartMode('bar')" id="chart-mode-bar" class="chart-mode-btn px-2.5 py-0.5 rounded text-terminal-muted hover:text-white">每日收支柱</button>
                    </div>

                    <div class="bg-terminal-bg p-1 rounded-lg border border-terminal-border flex text-xs font-mono">
                        <button onclick="setChartRange('7D')" id="range-7D" class="range-btn px-2 py-0.5 rounded text-terminal-muted hover:text-white">7D</button>
                        <button onclick="setChartRange('30D')" id="range-30D" class="range-btn px-2 py-0.5 rounded text-terminal-muted hover:text-white">30D</button>
                        <button onclick="setChartRange('ALL')" id="range-ALL" class="range-btn px-2 py-0.5 rounded bg-blue-600 text-white font-bold">ALL</button>
                    </div>
                </div>
            </div>

            <div class="relative w-full h-64 sm:h-80">
                <canvas id="cashflowChart"></canvas>
            </div>
        </section>
    </main>

    <!-- 共用手機底部導航 -->
    <div id="shared-mobile-nav"></div>

    <script src="app.js"></script>
    <script>
        window.CURRENT_PAGE_ID = 'overview';
        let currentChartMode = 'cumulative';
        let currentChartRange = 'ALL';
        let cashflowChartInstance = null;

        function populateOverviewFilters() {
            const codes = Object.keys(window.currencyRegistry);
            const treeFilter = document.getElementById('tree-currency-filter');
            const prevTree = treeFilter.value || 'ALL';
            treeFilter.innerHTML = `<option value="ALL">顯示全部幣別戶口</option>` +
                codes.map(c => `<option value="${c}">只看 ${getCurrencyDisplayOption(c)} 戶口</option>`).join('');
            treeFilter.value = [...treeFilter.options].some(o => o.value === prevTree) ? prevTree : 'ALL';

            const chartScope = document.getElementById('chart-currency-scope');
            const prevChart = chartScope.value || 'BASE';
            chartScope.innerHTML = `<option value="BASE">全部折合基準幣 (${window.baseCurrency})</option>` +
                codes.map(c => `<option value="${c}">僅看 ${c} 原幣</option>`).join('');
            chartScope.value = [...chartScope.options].some(o => o.value === prevChart) ? prevChart : 'BASE';
        }

        function renderLocationTree() {
            const grid = document.getElementById('location-tree-grid');
            const currFilter = document.getElementById('tree-currency-filter').value;
            const groups = {};

            window.db.accounts.forEach(acc => {
                if (currFilter !== 'ALL' && acc.currency !== currFilter) return;
                if (!groups[acc.institutionName]) {
                    groups[acc.institutionName] = { institutionName: acc.institutionName, category: acc.category, subAccounts: [] };
                }
                groups[acc.institutionName].subAccounts.push(acc);
            });

            const groupList = Object.values(groups);
            if (groupList.length === 0) {
                grid.innerHTML = `<div class="col-span-full py-8 text-center text-xs text-terminal-muted">該幣別下尚無設定任何銀行或平台戶口。</div>`;
                return;
            }

            grid.innerHTML = groupList.map(grp => {
                const instCashByCurr = {};
                const instHoldingsByCurr = {};
                let totalHoldingCount = 0;

                const subRowsHtml = grp.subAccounts.map(sub => {
                    const cashBal = getAccountDynamicBalance(sub);
                    instCashByCurr[sub.currency] = (instCashByCurr[sub.currency] || 0) + cashBal;

                    const subHoldings = window.db.holdings.filter(h => h.accountId === sub.id);
                    const subHoldingCost = subHoldings.reduce((s, h) => s + h.actualCost, 0);
                    if (subHoldingCost > 0) {
                        instHoldingsByCurr[sub.currency] = (instHoldingsByCurr[sub.currency] || 0) + subHoldingCost;
                    }
                    totalHoldingCount += subHoldings.length;

                    const convertedNote = (window.currencyDisplayMode === 'converted' && sub.currency !== window.baseCurrency)
                        ? (() => {
                            const conv = convertCurrency(cashBal + subHoldingCost, sub.currency, window.baseCurrency);
                            return conv === null
                                ? `<span class="text-[10px] text-rose-400 font-mono block">未設匯率 / 匯率待填</span>`
                                : `<span class="text-[10px] text-blue-400 font-mono block">≈ ${formatMoney(conv, window.baseCurrency, 0)}</span>`;
                        })()
                        : '';

                    return `
                        <div class="bg-terminal-bg/90 border border-terminal-border/80 rounded-xl p-3 flex flex-wrap items-center justify-between gap-2">
                            <div>
                                <div class="flex items-center gap-2">
                                    <span class="text-xs font-bold text-white">${sub.subAccountName}</span>
                                    <span class="text-[10px] font-mono px-1.5 py-0.5 rounded bg-terminal-card border border-terminal-border text-blue-300">${sub.currency}</span>
                                </div>
                                <div class="text-[11px] text-terminal-muted mt-0.5">
                                    ${subHoldings.length > 0 ? `持有 ${subHoldings.length} 筆債券/定存/期貨 (成本 ${formatMoney(subHoldingCost, sub.currency, 0)})` : '純現金流動戶口'}
                                </div>
                            </div>
                            <div class="text-right">
                                <div class="text-[11px] text-terminal-muted">可用現金結餘</div>
                                <div class="font-mono font-bold text-sm text-white tabular-nums">${formatMoney(cashBal, sub.currency, 2)}</div>
                                ${convertedNote}
                            </div>
                        </div>
                    `;
                }).join('');

                const badgeHtml = grp.category === 'broker'
                    ? `<span class="text-[11px] px-2 py-0.5 rounded bg-purple-500/15 text-purple-400 border border-purple-500/30 font-medium">📱 投資平台 App</span>`
                    : `<span class="text-[11px] px-2 py-0.5 rounded bg-blue-500/15 text-blue-400 border border-blue-500/30 font-medium">🏦 銀行機構</span>`;

                return `
                    <div class="bg-terminal-bg/40 border border-terminal-border rounded-2xl p-4 space-y-3 hover:border-blue-500/30 transition">
                        <div class="flex flex-wrap items-start justify-between gap-2 pb-2.5 border-b border-terminal-border/80">
                            <div>
                                <div class="flex items-center gap-2">
                                    <h3 class="font-bold text-base text-white">${grp.institutionName}</h3>
                                    ${badgeHtml}
                                </div>
                                <div class="text-[11px] text-terminal-muted mt-1">共 ${grp.subAccounts.length} 個細項戶口 · ${totalHoldingCount} 筆在途持倉</div>
                            </div>
                            <div class="text-right">
                                <div class="text-[10px] text-terminal-muted">該平台現金小計</div>
                                <div class="font-mono font-bold text-xs sm:text-sm text-emerald-400 tabular-nums">${formatMultiCurrencySummary(instCashByCurr, 0)}</div>
                                ${Object.keys(instHoldingsByCurr).length > 0 ? `<div class="text-[10px] font-mono text-purple-300 mt-0.5">持倉: ${formatMultiCurrencySummary(instHoldingsByCurr, 0)}</div>` : ''}
                            </div>
                        </div>
                        <div class="space-y-2">${subRowsHtml}</div>
                    </div>
                `;
            }).join('');
        }

        function setChartMode(mode) {
            currentChartMode = mode;
            document.querySelectorAll('.chart-mode-btn').forEach(b => {
                b.classList.remove('bg-terminal-hover', 'text-white', 'font-medium');
                b.classList.add('text-terminal-muted');
            });
            const active = document.getElementById(`chart-mode-${mode}`);
            active.classList.add('bg-terminal-hover', 'text-white', 'font-medium');
            active.classList.remove('text-terminal-muted');
            renderCashflowChart();
        }

        function setChartRange(range) {
            currentChartRange = range;
            document.querySelectorAll('.range-btn').forEach(b => {
                b.classList.remove('bg-blue-600', 'text-white', 'font-bold');
                b.classList.add('text-terminal-muted');
            });
            const active = document.getElementById(`range-${range}`);
            active.classList.add('bg-blue-600', 'text-white', 'font-bold');
            active.classList.remove('text-terminal-muted');
            renderCashflowChart();
        }

        function renderCashflowChart() {
            const ctx = document.getElementById('cashflowChart');
            if (!ctx) return;

            const scope = document.getElementById('chart-currency-scope').value;
            const targetCurr = scope === 'BASE' ? window.baseCurrency : scope;
            const cutoffDays = currentChartRange === '7D' ? 7 : (currentChartRange === '30D' ? 30 : 9999);
            const cutoffDate = new Date();
            cutoffDate.setDate(cutoffDate.getDate() - cutoffDays);

            const dailyMap = {};
            window.db.cashflows.forEach(cf => {
                if (new Date(cf.date) < cutoffDate) return;
                if (!dailyMap[cf.date]) dailyMap[cf.date] = { income: 0, expense: 0 };

                if (cf.type === 'transfer') {
                    if (scope !== 'BASE') {
                        if (cf.toCurrency === scope) dailyMap[cf.date].income += cf.toAmount;
                        if (cf.fromCurrency === scope) dailyMap[cf.date].expense += cf.fromAmount;
                    }
                    if (cf.fee > 0) {
                        const feeCurr = cf.feeCurrency || cf.fromCurrency;
                        if (scope === 'BASE') {
                            const cFee = convertCurrency(cf.fee, feeCurr, window.baseCurrency);
                            if (cFee !== null) dailyMap[cf.date].expense += cFee;
                        } else if (feeCurr === scope) {
                            dailyMap[cf.date].expense += cf.fee;
                        }
                    }
                } else {
                    const acc = window.db.accounts.find(a => a.id === cf.accountId);
                    const curr = acc ? acc.currency : 'HKD';
                    if (scope !== 'BASE' && curr !== scope) return;

                    const val = scope === 'BASE' ? convertCurrency(cf.amount, curr, window.baseCurrency) : cf.amount;
                    const feeVal = cf.fee > 0 ? (scope === 'BASE' ? convertCurrency(cf.fee, cf.feeCurrency || curr, window.baseCurrency) : cf.fee) : 0;
                    if (val === null || feeVal === null) return;

                    if (cf.type === 'income') {
                        dailyMap[cf.date].income += val;
                        dailyMap[cf.date].expense += feeVal;
                    } else {
                        dailyMap[cf.date].expense += (val + feeVal);
                    }
                }
            });

            const sortedDates = Object.keys(dailyMap).sort();
            const labels = sortedDates.length > 0 ? sortedDates : [getRelativeDate(0)];

            let runningTotal = window.db.accounts.reduce((sum, acc) => {
                if (scope !== 'BASE' && acc.currency !== scope) return sum;
                const initVal = scope === 'BASE' ? convertCurrency(acc.initialBalance, acc.currency, window.baseCurrency) : acc.initialBalance;
                return sum + (initVal || 0);
            }, 0);

            const cumulativeSeries = [];
            const incomeSeries = [];
            const expenseSeries = [];

            labels.forEach(d => {
                const item = dailyMap[d] || { income: 0, expense: 0 };
                runningTotal += (item.income - item.expense);
                cumulativeSeries.push(Math.round(runningTotal));
                incomeSeries.push(Math.round(item.income));
                expenseSeries.push(Math.round(item.expense));
            });

            if (cashflowChartInstance) cashflowChartInstance.destroy();

            const chartCtx = ctx.getContext('2d');
            const gradient = chartCtx.createLinearGradient(0, 0, 0, 300);
            gradient.addColorStop(0, 'rgba(8, 153, 129, 0.35)');
            gradient.addColorStop(1, 'rgba(8, 153, 129, 0.0)');

            const datasets = currentChartMode === 'cumulative'
                ? [{
                    label: `累計現金淨值曲線 (${targetCurr})`,
                    data: cumulativeSeries,
                    borderColor: '#089981',
                    backgroundColor: gradient,
                    borderWidth: 2.5,
                    pointBackgroundColor: '#089981',
                    pointBorderColor: '#131722',
                    pointRadius: 4,
                    fill: true,
                    tension: 0.25
                }]
                : [
                    { label: `入帳 (${targetCurr})`, data: incomeSeries, backgroundColor: '#089981', borderRadius: 4 },
                    { label: `支帳與手續費 (${targetCurr})`, data: expenseSeries, backgroundColor: '#f23645', borderRadius: 4 }
                ];

            cashflowChartInstance = new Chart(ctx, {
                type: currentChartMode === 'cumulative' ? 'line' : 'bar',
                data: { labels, datasets },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: { mode: 'index', intersect: false },
                    plugins: {
                        legend: { labels: { color: '#d1d4dc', font: { family: 'Inter', size: 12 } } },
                        tooltip: { backgroundColor: '#1e222d', titleColor: '#fff', bodyColor: '#d1d4dc', borderColor: '#2a2e39', borderWidth: 1 }
                    },
                    scales: {
                        x: { grid: { color: 'rgba(42, 46, 57, 0.45)' }, ticks: { color: '#787b86', font: { family: 'JetBrains Mono', size: 11 } } },
                        y: {
                            position: 'right',
                            grid: { color: 'rgba(42, 46, 57, 0.45)' },
                            ticks: { color: '#787b86', font: { family: 'JetBrains Mono', size: 11 }, callback: v => `${getCurrencySymbol(targetCurr)}${v.toLocaleString()}` }
                        }
                    }
                }
            });
        }

        window.onPageDataUpdated = function() {
            populateOverviewFilters();
            renderLocationTree();
            renderCashflowChart();
        };

        window.onload = function() {
            renderSharedChrome(window.CURRENT_PAGE_ID);
            window.onPageDataUpdated();
        };
    </script>
</body>
</html>
